# Integración continua de la PWA (prácticas 13 y 14): en cada push y pull request ejecuta las pruebas unitarias
# con cobertura y las pruebas de contrato, publica los resultados y comprueba que la app se publica.
name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      # tests/global.json activa Microsoft.Testing.Platform para dotnet test.
      - name: Pruebas unitarias con cobertura
        working-directory: tests
        run: |
          set -o pipefail
          dotnet test --project GastosApp.Web.Tests -c Release \
            -- --report-xunit-trx --results-directory "$GITHUB_WORKSPACE/TestResults" \
               --coverlet --coverlet-output-format cobertura | tee "$GITHUB_WORKSPACE/unit.txt"

      - name: Pruebas de contrato
        run: |
          set -o pipefail
          dotnet run --project ContractTests -c Release | tee contract.txt

      - name: Resumen
        if: always()
        run: |
          {
            echo "## Pruebas de la PWA"
            echo '```'; sed 's/\x1b\[[0-9;]*m//g' unit.txt | grep -E "total:|succeeded:|failed:|skipped:|duration:|correcto:|error:|omitido:|duración|con errores" || true; echo '```'
            echo '```'; tail -1 contract.txt || true; echo '```'
            cov=$(find TestResults tests/TestResults -name 'coverage.cobertura*.xml' 2>/dev/null | head -1)
            [ -n "$cov" ] && echo "Cobertura de líneas: $(grep -o 'line-rate="[0-9.]*"' "$cov" | head -1)  ·  ramas: $(grep -o 'branch-rate="[0-9.]*"' "$cov" | head -1)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar resultados
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: resultados-pruebas-pwa
          path: |
            TestResults/
            tests/TestResults/
            unit.txt
            contract.txt

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Publish
        run: dotnet publish GastosApp.Web.csproj -c Release -o out

      # Completa la Content-Security-Policy de _headers con el hash del importmap que generó la publicación.
      - name: Apply CSP
        run: node build/apply-csp.mjs out/wwwroot
